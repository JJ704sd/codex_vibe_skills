name: Validate core skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate skills
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Test-CoreSkills.ps1

      - name: Test validator behavior
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Test-CoreSkills.Validator.ps1

      - name: Test Windows GitHub auth probe behavior
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Test-WindowsGitHubAuthContext.Validator.ps1
